appId: com.raero.academy.qa
---
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Bonjour Recette."
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "course-${ENROLLMENT_ID}"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "course-${ENROLLMENT_ID}"
- scrollUntilVisible:
    element: "Commencer / reprendre l’évaluation"
    direction: DOWN
    centerElement: true
- tapOn: "Commencer / reprendre l’évaluation"
- scrollUntilVisible:
    element:
      id: "exam-start"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "exam-start"
- extendedWaitUntil:
    visible: "La documentation"
    timeout: 15000
- tapOn: "La documentation"
- tapOn: "La météo uniquement"
- back
- tapOn: "Quitter"
- extendedWaitUntil:
    visible: "Évaluation du chapitre"
    timeout: 25000
- takeScreenshot: latest-answer-flushed-before-leaving
