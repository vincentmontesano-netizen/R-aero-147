appId: com.raero.academy.qa
---
- tapOn:
    id: "field-Code de vérification"
- inputText: ${WRONG_CODE}
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Vérifiez votre connexion."
- tapOn:
    id: "auth-submit"
- assertVisible: "Code invalide.*"
- assertNotVisible: "Bonjour Recette."
- tapOn:
    id: "field-Code de vérification"
- eraseText
- inputText: ${CODE}
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Vérifiez votre connexion."
- tapOn:
    id: "auth-submit"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "Plus tard"
          optional: true
- extendedWaitUntil:
    visible: "Bonjour Recette."
    timeout: 15000
- assertVisible: "Votre bibliothèque vous attend"
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Bonjour Recette."
    timeout: 15000
- takeScreenshot: second-factor-session-restored
