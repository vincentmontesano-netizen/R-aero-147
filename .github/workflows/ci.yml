name: Validate application

on:
  pull_request: {}
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: raero_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-fixture-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d raero_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      RAERO_TEST_DATABASE_URL: postgres://postgres:ci-only-fixture-password@127.0.0.1:5432/raero_ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # Global test setup migrates the empty PostgreSQL service before test workers.
      - run: pnpm audit --audit-level=moderate
      - run: pnpm test --maxWorkers=4
      - run: python3 scripts/test_backup_container.py
      - run: bash -n docker-entrypoint.sh scripts/ci-container-smoke.sh
      - run: docker compose --env-file .env.production.example config --quiet
      - name: Build and exercise the all-in-one image
        run: |
          docker build -t raero-ci:validation .
          bash scripts/ci-container-smoke.sh raero-ci:validation
      - name: Install browser for acceptance tests
        run: pnpm exec playwright-core install --with-deps chrome
      - name: Exercise browser journeys on the validated image
        env:
          RAERO_E2E_IMAGE: raero-ci:validation
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: node scripts/e2e/run.mjs
      - name: Preserve acceptance results without session credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-acceptance-results
          path: |
            tmp/e2e/run-*/run.json
            tmp/e2e/run-*/*results.json
            tmp/e2e/run-*/*.png
          retention-days: 14
      - name: Remove isolated browser containers
        if: always()
        run: docker ps -aq --filter label=raero.e2e=1 | xargs -r docker rm -f
