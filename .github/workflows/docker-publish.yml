# Build the all-in-one Docker image and publish it to GitHub Container Registry
# (ghcr.io). Hostinger then just *pulls* this image — no source code or build
# step is needed on the VPS. Runs on every push to main, or manually.
name: Publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  build-and-push:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercases the image name (GHCR requires lowercase) and computes tags.
      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build candidate image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Exercise the exact locally loaded image before publishing it.
      - name: Verify candidate runtime
        env:
          IMAGE_ID: ${{ steps.build.outputs.imageid }}
        run: bash scripts/ci-container-smoke.sh "$IMAGE_ID"

      - name: Publish verified tags
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_ID: ${{ steps.build.outputs.imageid }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] && docker push "$tag"
          done <<< "$IMAGE_TAGS"
          docker image inspect "$IMAGE_ID" --format '{{join .RepoDigests "\n"}}' >> "$GITHUB_STEP_SUMMARY"
