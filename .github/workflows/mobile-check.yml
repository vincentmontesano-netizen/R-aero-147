name: Validate native learner code

on:
  pull_request:
    paths:
      [
        "mobile/**",
        "server/**",
        "shared/**",
        ".github/workflows/mobile-check.yml",
      ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: native-npm-${{ runner.os }}-${{ hashFiles('mobile/package-lock.json') }}
      - run: npm ci
        working-directory: mobile
      - run: npm run check
        working-directory: mobile
      - run: npx expo install --check
        working-directory: mobile
