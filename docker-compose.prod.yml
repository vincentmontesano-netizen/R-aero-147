# Production: set RAERO_IMAGE to the validated registry image@sha256:digest.
# Configure .env, then docker compose -f docker-compose.prod.yml up -d.
# No image is published or deployed by editing this file.
services:
  app:
    image: ${RAERO_IMAGE:?Set RAERO_IMAGE to the validated registry image digest}
    pull_policy: if_not_present
    container_name: r-aero-academy
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      STORAGE_DIR: /app/storage
      VITE_APP_ID: r-aero-training-academy
      # Session secret. Leave empty → the entrypoint auto-generates a strong one and
      # persists it in the volume (stable across restarts). Or set your own.
      JWT_SECRET: ${JWT_SECRET:-}
      APP_ORIGIN: ${APP_ORIGIN:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      # ── First admin (existing accounts are never overwritten) ──
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      JAAS_APP_ID: ${JAAS_APP_ID:-}
      JAAS_API_KEY_ID: ${JAAS_API_KEY_ID:-}
      JAAS_PRIVATE_KEY: ${JAAS_PRIVATE_KEY:-}
      STRIPE_PRICE_STANDARD_SEAT: ${STRIPE_PRICE_STANDARD_SEAT:-}
      STRIPE_PRICE_ALL_INCLUSIVE: ${STRIPE_PRICE_ALL_INCLUSIVE:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # ── Stripe ── (unset = payments unavailable)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      VITE_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      # ── AI (e-learning maker). Mistral does text + image + voice. ──
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      AI_TEXT_REQUESTS_PER_HOUR: ${AI_TEXT_REQUESTS_PER_HOUR:-30}
      AI_IMAGE_REQUESTS_PER_HOUR: ${AI_IMAGE_REQUESTS_PER_HOUR:-10}
      AI_SPEECH_REQUESTS_PER_HOUR: ${AI_SPEECH_REQUESTS_PER_HOUR:-20}
      AI_VIDEO_REQUESTS_PER_HOUR: ${AI_VIDEO_REQUESTS_PER_HOUR:-2}
      GEMINI_VIDEO_MODEL: ${GEMINI_VIDEO_MODEL:-}
      INVOICE_ISSUER_JSON: ${INVOICE_ISSUER_JSON:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # ── Email (SMTP send + IMAP reception). Unset = emails are logged only. ──
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ADMIN_NOTIFY_EMAIL: ${ADMIN_NOTIFY_EMAIL:-}
      IMAP_HOST: ${IMAP_HOST:-imap.hostinger.com}
      IMAP_PORT: ${IMAP_PORT:-993}
    volumes:
      # Persist the embedded database and generated/uploaded files across restarts.
      - raero-db:/var/lib/postgresql/data
      - raero-storage:/app/storage

volumes:
  raero-db:
    driver: local
  raero-storage:
    driver: local
