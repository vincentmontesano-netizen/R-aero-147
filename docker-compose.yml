# ─── R-AERO Training Academy — single all-in-one container ───────────────────
# Front-end + back-end + PostgreSQL embedded in one image.
#   docker compose up --build
# Then open http://localhost:3000
#   Admin     : admin@r-aero.academy / Admin1234!
#   Apprenant : jean.dupont@example.com / Learner1234!
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: r-aero-academy
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      # Leave empty to auto-generate a stable secret persisted in the volume; or set your own.
      JWT_SECRET: ${JWT_SECRET:-}
      VITE_APP_ID: r-aero-training-academy
      # ── Optional integrations (left empty = demo mode) ──
      # Stripe — if unset, checkout runs in demo mode (access granted instantly).
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-}
      # AI e-learning maker — set any/all. Text: all 4. Image+voice: OpenAI or Google.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
    volumes:
      # Persist the embedded database and generated PDFs across restarts.
      - raero-db:/var/lib/postgresql/data
      - raero-storage:/app/storage

volumes:
  raero-db:
    driver: local
  raero-storage:
    driver: local
